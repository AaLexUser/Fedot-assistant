[project]
name = "fedotllm-workspace"
version = "0.1.0"
description = "LLM-based multi-AutoML Orchestrator - Workspace Configuration"
authors = [{ name = "Alexey Lapin", email = "a.lapin@itmo.ru" }]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fedotllm",
    "fedotllm-server",
    "fedotllm-frontend",
]

[dependency-groups]
dev = [
    "ruff>=0.11.13",
]

[tool.uv.workspace]
members = [
    "packages/fedotllm",
    "packages/shared",
    "apps/frontend",
    "apps/server",
]

[tool.uv.sources]
caafe = { git = "https://github.com/AaLexUser/CAAFE.git" }
fedot = { git = "https://github.com/aimclub/FEDOT.git" }
fedotllm = { workspace = true }
shared = { workspace = true }
fedotllm-server = { workspace = true }
fedotllm-frontend = { workspace = true }
