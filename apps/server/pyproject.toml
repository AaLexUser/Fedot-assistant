[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedotllm-server"
version = "0.1.0"
description = "FedotLLM Server Application - FastAPI Backend"
authors = [{ name = "Alexey Lapin", email = "a.lapin@itmo.ru" }]
readme = "../../README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "shared",
    "fedotllm",
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "python-dotenv>=1.1.0",
    "pydantic>=2.0.0",
]

[project.scripts]
fedotllm-server = "server.main:start_server"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[dependency-groups]
dev = [
    "ruff>=0.11.13",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
