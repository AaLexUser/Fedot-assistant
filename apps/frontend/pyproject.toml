[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedotllm-frontend"
version = "0.1.0"
description = "FedotLLM Frontend Application - Streamlit UI"
authors = [{ name = "Alexey Lapin", email = "a.lapin@itmo.ru" }]
readme = "../../README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "shared",
    "fedotllm",
    "streamlit>=1.55.0",
    "streamlit-extras>=0.7.8",
    "streamlit-aggrid>=1.2.1.post2",
    "python-dotenv>=1.1.0",
]

[project.scripts]
fedotllm-ui = "frontend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frontend"]

[dependency-groups]
dev = [
    "ruff>=0.11.13",
]
